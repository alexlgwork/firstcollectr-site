# Publish this repository's files as the GitHub Pages site on every push to main (and by hand: Actions > Publish site
# > Run workflow). One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions", and Custom
# domain: www.firstcollectr.com. The files here are built by alexlgwork/firstui (site/build.py); nothing is built here.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
