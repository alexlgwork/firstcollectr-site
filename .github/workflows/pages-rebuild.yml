# Ask GitHub Pages to rebuild the site whenever main changes. Pushes made by an app (like Claude publishing a new
# build from alexlgwork/firstui) don't always start a Pages build on their own; this makes every publish go live.
# It can also be run by hand: Actions > Rebuild GitHub Pages > Run workflow.
name: Rebuild GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '.status'
          sleep 20
          gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"latest build: " + .status + " " + .commit'
